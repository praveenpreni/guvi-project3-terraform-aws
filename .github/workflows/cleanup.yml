name: Project 3 cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-project3-dev
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: ap-south-1
  TF_VAR_aws_region: ap-south-1
  TF_VAR_environment: dev
jobs:
  destroy-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Initialize existing project state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test "$STATE_BUCKET" = 'guvi-project3-state-782610231927-ap-south-1'
          test "$(aws sts get-caller-identity --query Account --output text)" = '782610231927'
          terraform init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=project3/dev/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform state list
      - name: Plan deletion of this project only
        run: |
          terraform plan -destroy -lock-timeout=5m -out=destroy.tfplan
          terraform show -no-color destroy.tfplan > destroy-plan.txt
          terraform show -json destroy.tfplan > /tmp/destroy.json
          jq -e 'all(.resource_changes[]?; (.change.actions == ["delete"] or .change.actions == ["no-op"]))' /tmp/destroy.json
          jq -e 'all(.resource_changes[]?; .type != "aws_instance" or .change.before.id == "i-0e85ac8e48c4dfe3c")' /tmp/destroy.json
          jq -e 'all(.resource_changes[]?; .type != "aws_vpc" or .change.before.id == "vpc-0e32795f6dc58823d")' /tmp/destroy.json
          sha256sum destroy.tfplan > destroy.tfplan.sha256
          echo '### Project 3 deletion plan' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.resource_changes[] | select(.change.actions == ["delete"]) | .address' /tmp/destroy.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '[.resource_changes[] | select(.change.actions == ["delete"])] | "Total resources to delete: \(length)"' /tmp/destroy.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: project3-destroy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            destroy.tfplan
            destroy.tfplan.sha256
            destroy-plan.txt
          retention-days: 7
  destroy:
    needs: destroy-plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Initialize existing project state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=project3/dev/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - uses: actions/download-artifact@v4
        with:
          name: project3-destroy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Apply approved deletion plan
        run: |
          sha256sum -c destroy.tfplan.sha256
          terraform apply -lock-timeout=5m destroy.tfplan
          test -z "$(terraform state list)"
          echo 'Project 3 application state is empty after deletion.' >> "$GITHUB_STEP_SUMMARY"
